apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-service
  namespace: loan-system
spec:
  replicas: 3
  selector:
    matchLabels:
      app: loan-service
  template:
    metadata:
      labels:
        app: loan-service
    spec:
      containers:
      - name: loan-service
        image: loan-service:latest
        ports:
        - containerPort: 5000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: loan-service-secrets
              key: database-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: loan-service-secrets
              key: jwt-secret
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: loan-service
  namespace: loan-system
spec:
  selector:
    app: loan-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000
  type: ClusterIP

---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-loan-db
  namespace: loan-system
spec:
  template:
    spec:
      containers:
      - name: migrate
        image: loan-service:latest
        command: ["/bin/sh", "-c", "python -m infrastructure.db.migrate"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: loan-service-secrets
              key: database-url
      restartPolicy: OnFailure
